<!-- Sticky Navbar -->
<app-navbar />

<!-- Main Content with Smooth-Scroll Sections -->
<main id="main-content" class="portfolio-main">
  <!-- Hero Section (Eager) -->
  <app-hero />

  <!-- About Section (Eager) -->
  <app-about />

  <!-- Skills Section (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-skills />
  } @placeholder {
    <div class="section-skeleton" aria-hidden="true"></div>
  }

  <!-- Projects Section (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-projects />
  } @placeholder {
    <div class="section-skeleton" aria-hidden="true"></div>
  }

  <!-- Experience Section (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-experience />
  } @placeholder {
    <div class="section-skeleton" aria-hidden="true"></div>
  }

  <!-- Education Section (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-education />
  } @placeholder {
    <div class="section-skeleton" aria-hidden="true"></div>
  }

  <!-- Contact Section (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-contact />
  } @placeholder {
    <div class="section-skeleton" aria-hidden="true"></div>
  }
</main>

<!-- Footer -->
<app-footer />
